<svg xmlns="http://www.w3.org/2000/svg" width="2490" height="932" viewBox="-50 -90 2490 932"><rect x="-50" y="-90" width="2490" height="932" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">AWS knowledge assistant (SharePoint/Confluence, cited answers) · r2</tspan></text><path d="M290,126 C380,126 380,166 470,166" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="0" width="210" height="26" fill="white"/><text x="380" y="18" text-anchor="middle" font-size="12"><tspan x="380" dy="0">HTTPS</tspan></text><path d="M710,166 C800,166 800,251 890,251" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="0" width="210" height="26" fill="white"/><text x="800" y="18" text-anchor="middle" font-size="12"><tspan x="800" dy="0">sign-in (PKCE + MFA)</tspan></text><path d="M1130,251 C1220,251 1220,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="0" width="210" height="26" fill="white"/><text x="1220" y="18" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">JWT authorizer</tspan></text><path d="M710,166 C1010,166 1010,156 1310,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="0" width="210" height="26" fill="white"/><text x="1010" y="18" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">question → cited answer</tspan></text><path d="M1550,156 C1640,156 1640,186 1730,186" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="0" width="210" height="26" fill="white"/><text x="1640" y="18" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">invoke</tspan></text><path d="M1970,186 C2060,186 2060,446 2150,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-18" width="210" height="44" fill="white"/><text x="2060" y="0" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">ACL-filtered keyword rea</tspan><tspan x="2060" dy="18">d</tspan></text><path d="M1970,186 C2060,186 2060,156 2150,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="-28" width="210" height="44" fill="white"/><text x="2060" y="-10" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">Converse (grounded pro</tspan><tspan x="2060" dy="18">mpt)</tspan></text><path d="M1970,446 C2060,446 2060,446 2150,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="262" width="210" height="44" fill="white"/><text x="2060" y="280" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">snapshot sync, ACLs, de</tspan><tspan x="2060" dy="18">letes</tspan></text><path d="M1970,706 C2060,706 2060,446 2150,446" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1955" y="262" width="210" height="44" fill="white"/><text x="2060" y="280" text-anchor="middle" font-size="12"><tspan x="2060" dy="0">snapshot sync, ACLs, de</tspan><tspan x="2060" dy="18">letes</tspan></text><g><rect x="50" y="60" width="240" height="132" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="86" font-size="14"><tspan x="66" dy="0">Staff browser</tspan><tspan x="66" dy="20">Staff member&apos;s browser. This is a</tspan><tspan x="66" dy="20"> client reference, not a provisione</tspan><tspan x="66" dy="20">d service.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="60" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="86" font-size="14"><tspan x="486" dy="0">Web app</tspan><tspan x="486" dy="20">Amazon CloudFront</tspan><tspan x="486" dy="20">Browser channel (required scope</tspan><tspan x="486" dy="20">). It owns private S3 assets and </tspan><tspan x="486" dy="20">CloudFront access control, uses </tspan><tspan x="486" dy="20">authorization code with PKCE, a</tspan><tspan x="486" dy="20">nd shows answers with citations.</tspan><tspan x="486" dy="20">To be selected (candidate ap-sou</tspan><tspan x="486" dy="20">theast-2 Sydney)</tspan></text></g><g><rect x="890" y="135" width="240" height="232" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="161" font-size="14"><tspan x="906" dy="0">User sign-in</tspan><tspan x="906" dy="20">Amazon Cognito</tspan><tspan x="906" dy="20">User pool with admin-created us</tspan><tspan x="906" dy="20">ers, required software-token MFA</tspan><tspan x="906" dy="20">, an access-token scope, and cat</tspan><tspan x="906" dy="20">alog-backed identity and employ</tspan><tspan x="906" dy="20">ee-region mapping. Users are on</tspan><tspan x="906" dy="20">boarded with the operator tool.</tspan><tspan x="906" dy="20">To be selected (candidate ap-sou</tspan><tspan x="906" dy="20">theast-2 Sydney)</tspan></text></g><g><rect x="1310" y="60" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="86" font-size="14"><tspan x="1326" dy="0">RAG API</tspan><tspan x="1326" dy="20">Amazon API Gateway</tspan><tspan x="1326" dy="20">Authenticated, bounded HTTP A</tspan><tspan x="1326" dy="20">PI with a JWT browser route. The</tspan><tspan x="1326" dy="20">re is no anonymous access. Acc</tspan><tspan x="1326" dy="20">ess logs support the audit trail.</tspan><tspan x="1326" dy="20">To be selected (candidate ap-sou</tspan><tspan x="1326" dy="20">theast-2 Sydney)</tspan></text></g><g><rect x="1730" y="60" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="86" font-size="14"><tspan x="1746" dy="0">Keyword RAG function</tspan><tspan x="1746" dy="20">AWS Lambda</tspan><tspan x="1746" dy="20">Keyword retrieval with ACL and r</tspan><tspan x="1746" dy="20">egion filtering and revision reche</tspan><tspan x="1746" dy="20">cks, then a cited answer that is re</tspan><tspan x="1746" dy="20">turned through the API. It owns it</tspan><tspan x="1746" dy="20">s execution role, logs, version an</tspan><tspan x="1746" dy="20">d alias. Unknown identities fail cl</tspan><tspan x="1746" dy="20">osed.</tspan><tspan x="1746" dy="20">To be selected (candidate ap-sou</tspan><tspan x="1746" dy="20">theast-2 Sydney)</tspan></text></g><g><rect x="2150" y="340" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="366" font-size="14"><tspan x="2166" dy="0">Document catalog</tspan><tspan x="2166" dy="20">Amazon DynamoDB</tspan><tspan x="2166" dy="20">Holds up to 100 small UTF-8 doc</tspan><tspan x="2166" dy="20">uments with explicit ACLs, revisio</tspan><tspan x="2166" dy="20">ns, tombstones for deletes and a </tspan><tspan x="2166" dy="20">sync checkpoint. Writes are cond</tspan><tspan x="2166" dy="20">itional.</tspan><tspan x="2166" dy="20">To be selected (candidate ap-sou</tspan><tspan x="2166" dy="20">theast-2 Sydney)</tspan></text></g><g><rect x="2150" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="2166" y="76" font-size="14"><tspan x="2166" dy="0">Foundation model</tspan><tspan x="2166" dy="20">Amazon Bedrock</tspan><tspan x="2166" dy="20">Existing Bedrock direct model, se</tspan><tspan x="2166" dy="20">lected by a required model-ID inp</tspan><tspan x="2166" dy="20">ut. Model access, Converse supp</tspan><tspan x="2166" dy="20">ort, quotas and regional availabili</tspan><tspan x="2166" dy="20">ty are not yet verified.</tspan><tspan x="2166" dy="20">To be selected (candidate ap-sou</tspan><tspan x="2166" dy="20">theast-2 Sydney)</tspan></text></g><g><rect x="1730" y="340" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="366" font-size="14"><tspan x="1746" dy="0">SharePoint (test server)</tspan><tspan x="1746" dy="20">Existing SharePoint, represented</tspan><tspan x="1746" dy="20"> here by the approved local norm</tspan><tspan x="1746" dy="20">alized source-contract test server</tspan><tspan x="1746" dy="20">. It provides snapshots, ACLs, up</tspan><tspan x="1746" dy="20">dates and deletes. The native AP</tspan><tspan x="1746" dy="20">I and real-tenant compatibility are</tspan><tspan x="1746" dy="20"> not verified.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="1730" y="620" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="646" font-size="14"><tspan x="1746" dy="0">Confluence (test server)</tspan><tspan x="1746" dy="20">Existing Confluence, represented</tspan><tspan x="1746" dy="20"> here by the approved local norm</tspan><tspan x="1746" dy="20">alized source-contract test server</tspan><tspan x="1746" dy="20">. The native API and real-tenant </tspan><tspan x="1746" dy="20">compatibility are not verified.</tspan><tspan x="1746" dy="20">To be selected</tspan></text></g><g><rect x="50" y="340" width="240" height="132" rx="10" fill="#fff5bd" stroke="#7290ad"/><text x="66" y="366" font-size="14"><tspan x="66" dy="0">Later: Microsoft Teams channel</tspan><tspan x="66" dy="20">Teams is a deferred channel for a</tspan><tspan x="66" dy="20"> later phase. It is not part of this d</tspan><tspan x="66" dy="20">eployment.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g></g></svg>