<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="522" viewBox="-50 -90 1230 522"><rect x="-50" y="-90" width="1230" height="522" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Authenticated Bedrock text summarizer · r2</tspan></text><path d="M290,136 C380,136 380,216 470,216" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-28" width="210" height="44" fill="white"/><text x="380" y="-10" text-anchor="middle" font-size="12"><tspan x="380" dy="0">IAM invoke {text} → sum</tspan><tspan x="380" dy="18">mary</tspan></text><path d="M710,216 C800,216 800,176 890,176" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="-28" width="210" height="44" fill="white"/><text x="800" y="-10" text-anchor="middle" font-size="12"><tspan x="800" dy="0">Converse (≤512 tokens, </tspan><tspan x="800" dy="18">2 attempts)</tspan></text><g><rect x="50" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Existing IAM caller</tspan><tspan x="66" dy="20">Existing IAM principal (test harne</tspan><tspan x="66" dy="20">ss), outside the provisioning scop</tspan><tspan x="66" dy="20">e. It invokes the summary functio</tspan><tspan x="66" dy="20">n&apos;s live alias with SigV4 and send</tspan><tspan x="66" dy="20">s {text}. Its identity is not verified.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="332" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Summary function</tspan><tspan x="486" dy="20">AWS Lambda</tspan><tspan x="486" dy="20">Validates the input size, calls Bed</tspan><tspan x="486" dy="20">rock Converse with bounded out</tspan><tspan x="486" dy="20">put and retries, and returns the s</tspan><tspan x="486" dy="20">ummary to the caller. It owns its e</tspan><tspan x="486" dy="20">xecution role (bedrock:InvokeMo</tspan><tspan x="486" dy="20">del on the selected model ARN o</tspan><tspan x="486" dy="20">nly), a scoped CloudWatch Logs </tspan><tspan x="486" dy="20">group, a published version and a </tspan><tspan x="486" dy="20">live alias. Candidate region: ap-s</tspan><tspan x="486" dy="20">outheast-2 (Sydney), not approve</tspan><tspan x="486" dy="20">d.</tspan><tspan x="486" dy="20">ap-southeast-2 (candidate, unap</tspan><tspan x="486" dy="20">proved)</tspan></text></g><g><rect x="890" y="50" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="76" font-size="14"><tspan x="906" dy="0">Amazon Bedrock model</tspan><tspan x="906" dy="20">Amazon Bedrock</tspan><tspan x="906" dy="20">A direct foundation model selecte</tspan><tspan x="906" dy="20">d through a required Terraform m</tspan><tspan x="906" dy="20">odel-ID input. No cross-region inf</tspan><tspan x="906" dy="20">erence profile is used. Model acc</tspan><tspan x="906" dy="20">ess, Converse support, quotas a</tspan><tspan x="906" dy="20">nd Sydney availability have not b</tspan><tspan x="906" dy="20">een checked yet.</tspan><tspan x="906" dy="20">ap-southeast-2 (candidate, unap</tspan><tspan x="906" dy="20">proved)</tspan></text></g></g></svg>