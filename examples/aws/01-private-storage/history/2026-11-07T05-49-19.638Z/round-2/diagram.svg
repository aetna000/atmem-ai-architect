<svg xmlns="http://www.w3.org/2000/svg" width="810" height="442" viewBox="-50 -90 810 442"><rect x="-50" y="-90" width="810" height="442" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">A private place on AWS to store a small… · r2</tspan></text><path d="M290,156 C380,156 380,176 470,176" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-28" width="210" height="44" fill="white"/><text x="380" y="-10" text-anchor="middle" font-size="12"><tspan x="380" dy="0">Upload and read docum</tspan><tspan x="380" dy="18">ents (S3 read/write)</tspan></text><g><rect x="50" y="50" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Test operator (existing IAM princi</tspan><tspan x="66" dy="20">pal)</tspan><tspan x="66" dy="20">An existing IAM role or user outsi</tspan><tspan x="66" dy="20">de the provisioning scope. It uplo</tspan><tspan x="66" dy="20">ads and reads the synthetic docu</tspan><tspan x="66" dy="20">ments. Its ARN is supplied as a r</tspan><tspan x="66" dy="20">eviewable input and is not verifie</tspan><tspan x="66" dy="20">d here.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Synthetic document bucket</tspan><tspan x="486" dy="20">Amazon S3</tspan><tspan x="486" dy="20">A private S3 bucket. All four Bloc</tspan><tspan x="486" dy="20">k Public Access settings are on, </tspan><tspan x="486" dy="20">server-side encryption is on, vers</tspan><tspan x="486" dy="20">ioning is enabled and a bucket p</tspan><tspan x="486" dy="20">olicy grants access only to the bo</tspan><tspan x="486" dy="20">und operator. It holds synthetic te</tspan><tspan x="486" dy="20">xt documents only.</tspan><tspan x="486" dy="20">Candidate: ap-southeast-2 (Sydn</tspan><tspan x="486" dy="20">ey), not approved</tspan></text></g></g></svg>