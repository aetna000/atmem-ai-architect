<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="682" viewBox="-50 -90 2070 682"><rect x="-50" y="-90" width="2070" height="682" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">An AWS assistant that answers questions… · r2</tspan></text><path d="M290,296 C380,296 380,221 470,221" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="55" width="210" height="26" fill="white"/><text x="380" y="73" text-anchor="middle" font-size="12"><tspan x="380" dy="0">sign-in (OAuth PKCE)</tspan></text><path d="M710,221 C800,221 800,276 890,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="55" width="210" height="26" fill="white"/><text x="800" y="73" text-anchor="middle" font-size="12"><tspan x="800" dy="0">JWT authorizer</tspan></text><path d="M290,296 C590,296 590,276 890,276" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="485" y="130" width="210" height="26" fill="white"/><text x="590" y="148" text-anchor="middle" font-size="12"><tspan x="590" dy="0">question → cited answer</tspan></text><path d="M1130,276 C1220,276 1220,316 1310,316" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="130" width="210" height="26" fill="white"/><text x="1220" y="148" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">invoke</tspan></text><path d="M1550,316 C1640,316 1640,176 1730,176" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="-28" width="210" height="44" fill="white"/><text x="1640" y="-10" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">keyword lookup (ACL-filt</tspan><tspan x="1640" dy="18">ered)</tspan></text><path d="M1550,316 C1640,316 1640,436 1730,436" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="112" width="210" height="44" fill="white"/><text x="1640" y="130" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">Converse (grounded pro</tspan><tspan x="1640" dy="18">mpt)</tspan></text><g><rect x="50" y="190" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">Web app</tspan><tspan x="66" dy="20">Amazon CloudFront</tspan><tspan x="66" dy="20">Browser chat interface. It owns pr</tspan><tspan x="66" dy="20">ivate S3 assets and CloudFront a</tspan><tspan x="66" dy="20">ccess control, and shows answer</tspan><tspan x="66" dy="20">s with citations or an insufficient-</tspan><tspan x="66" dy="20">evidence notice.</tspan><tspan x="66" dy="20">Candidate: ap-southeast-2 (Sydn</tspan><tspan x="66" dy="20">ey), not approved</tspan></text></g><g><rect x="470" y="115" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="141" font-size="14"><tspan x="486" dy="0">User sign-in</tspan><tspan x="486" dy="20">Amazon Cognito</tspan><tspan x="486" dy="20">User pool with admin-created us</tspan><tspan x="486" dy="20">ers, required software-token MFA</tspan><tspan x="486" dy="20">, access-token scope and catalog</tspan><tspan x="486" dy="20">-backed identity/region mappings</tspan><tspan x="486" dy="20">.</tspan><tspan x="486" dy="20">Candidate: ap-southeast-2 (Sydn</tspan><tspan x="486" dy="20">ey), not approved</tspan></text></g><g><rect x="890" y="190" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="216" font-size="14"><tspan x="906" dy="0">RAG API</tspan><tspan x="906" dy="20">Amazon API Gateway</tspan><tspan x="906" dy="20">Bounded, authenticated HTTP A</tspan><tspan x="906" dy="20">PI with a JWT browser route. The</tspan><tspan x="906" dy="20">re is no anonymous access.</tspan><tspan x="906" dy="20">Candidate: ap-southeast-2 (Sydn</tspan><tspan x="906" dy="20">ey), not approved</tspan></text></g><g><rect x="1310" y="190" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="216" font-size="14"><tspan x="1326" dy="0">Keyword retrieval + answer</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Runs ACL- and region-filtered ke</tspan><tspan x="1326" dy="20">yword retrieval, rechecks revision</tspan><tspan x="1326" dy="20">s so deleted or updated documen</tspan><tspan x="1326" dy="20">ts aren&apos;t cited, builds a cited ans</tspan><tspan x="1326" dy="20">wer or returns &apos;insufficient eviden</tspan><tspan x="1326" dy="20">ce&apos;. It owns its execution role, log</tspan><tspan x="1326" dy="20">s, version and alias.</tspan><tspan x="1326" dy="20">Candidate: ap-southeast-2 (Sydn</tspan><tspan x="1326" dy="20">ey), not approved</tspan></text></g><g><rect x="1730" y="50" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="76" font-size="14"><tspan x="1746" dy="0">Document catalog</tspan><tspan x="1746" dy="20">Amazon DynamoDB</tspan><tspan x="1746" dy="20">Stores up to 100 small UTF-8 sy</tspan><tspan x="1746" dy="20">nthetic documents with explicit A</tspan><tspan x="1746" dy="20">CLs and revisions. An operator in</tspan><tspan x="1746" dy="20">gests, updates and deletes docu</tspan><tspan x="1746" dy="20">ments through the generated ma</tspan><tspan x="1746" dy="20">nagement tool. Caller roles cann</tspan><tspan x="1746" dy="20">ot write to it.</tspan><tspan x="1746" dy="20">Candidate: ap-southeast-2 (Sydn</tspan><tspan x="1746" dy="20">ey), not approved</tspan></text></g><g><rect x="1730" y="330" width="240" height="212" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Foundation model</tspan><tspan x="1746" dy="20">Amazon Bedrock</tspan><tspan x="1746" dy="20">Existing direct foundation model, </tspan><tspan x="1746" dy="20">selected by a required model-ID i</tspan><tspan x="1746" dy="20">nput. Access, Converse support, </tspan><tspan x="1746" dy="20">quotas and regional availability ar</tspan><tspan x="1746" dy="20">e unverified.</tspan><tspan x="1746" dy="20">Candidate: ap-southeast-2 (Sydn</tspan><tspan x="1746" dy="20">ey), not approved</tspan></text></g></g></svg>