<svg xmlns="http://www.w3.org/2000/svg" width="2070" height="662" viewBox="-50 -90 2070 662"><rect x="-50" y="-90" width="2070" height="662" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Async word-count qualification pipeline · r2</tspan></text><path d="M290,266 C380,266 380,266 470,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="130" width="210" height="26" fill="white"/><text x="380" y="148" text-anchor="middle" font-size="12"><tspan x="380" dy="0">store/read files</tspan></text><path d="M710,266 C800,266 800,156 890,156" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="0" width="210" height="26" fill="white"/><text x="800" y="18" text-anchor="middle" font-size="12"><tspan x="800" dy="0">ObjectCreated event</tspan></text><path d="M1130,156 C1220,156 1220,426 1310,426" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="0" width="210" height="26" fill="white"/><text x="1220" y="18" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">event source mapping</tspan></text><path d="M1310,426 C1010,426 1010,266 710,266" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="905" y="130" width="210" height="26" fill="white"/><text x="1010" y="148" text-anchor="middle" font-size="12"><tspan x="1010" dy="0">GetObjectVersion</tspan></text><path d="M1550,426 C1640,426 1640,416 1730,416" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1535" y="270" width="210" height="26" fill="white"/><text x="1640" y="288" text-anchor="middle" font-size="12"><tspan x="1640" dy="0">conditional put count</tspan></text><path d="M1130,156 C1220,156 1220,136 1310,136" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-28" width="210" height="44" fill="white"/><text x="1220" y="-10" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">redrive after max receive</tspan><tspan x="1220" dy="18">s</tspan></text><g><rect x="50" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="216" font-size="14"><tspan x="66" dy="0">Existing uploader (IAM principal)</tspan><tspan x="66" dy="20">Existing IAM caller that stores an</tspan><tspan x="66" dy="20">d reads synthetic text files. It is o</tspan><tspan x="66" dy="20">utside the provisioning scope, an</tspan><tspan x="66" dy="20">d its identity is not verified.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">Private source bucket</tspan><tspan x="486" dy="20">Amazon S3</tspan><tspan x="486" dy="20">Private, versioned bucket. When </tspan><tspan x="486" dy="20">an object is created, it notifies the</tspan><tspan x="486" dy="20"> queue with the exact versionId.</tspan><tspan x="486" dy="20">ap-southeast-2 (candidate)</tspan></text></g><g><rect x="890" y="60" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="86" font-size="14"><tspan x="906" dy="0">Work queue</tspan><tspan x="906" dy="20">Amazon SQS</tspan><tspan x="906" dy="20">Standard queue. Retries failed m</tspan><tspan x="906" dy="20">essages by redelivering them aft</tspan><tspan x="906" dy="20">er the visibility timeout, which is a</tspan><tspan x="906" dy="20">t least six times the function time</tspan><tspan x="906" dy="20">out.</tspan><tspan x="906" dy="20">ap-southeast-2 (candidate)</tspan></text></g><g><rect x="1310" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Dead-letter queue</tspan><tspan x="1326" dy="20">Amazon SQS</tspan><tspan x="1326" dy="20">Holds poison messages after the </tspan><tspan x="1326" dy="20">maximum number of receives. Its</tspan><tspan x="1326" dy="20"> generated alarm needs an existi</tspan><tspan x="1326" dy="20">ng SNS topic in production.</tspan><tspan x="1326" dy="20">ap-southeast-2 (candidate)</tspan></text></g><g><rect x="1310" y="330" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Word-count worker</tspan><tspan x="1326" dy="20">AWS Lambda</tspan><tspan x="1326" dy="20">Reads the exact object version a</tspan><tspan x="1326" dy="20">nd counts words. Reports partial </tspan><tspan x="1326" dy="20">batch failures. Owns its executio</tspan><tspan x="1326" dy="20">n role, logs, version, alias and ev</tspan><tspan x="1326" dy="20">ent mapping.</tspan><tspan x="1326" dy="20">ap-southeast-2 (candidate)</tspan></text></g><g><rect x="1730" y="330" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1746" y="356" font-size="14"><tspan x="1746" dy="0">Word-count results</tspan><tspan x="1746" dy="20">Amazon DynamoDB</tspan><tspan x="1746" dy="20">Uses a conditional write for each </tspan><tspan x="1746" dy="20">object version, so duplicate deliv</tspan><tspan x="1746" dy="20">eries succeed without overwriting</tspan><tspan x="1746" dy="20"> results.</tspan><tspan x="1746" dy="20">ap-southeast-2 (candidate)</tspan></text></g></g></svg>