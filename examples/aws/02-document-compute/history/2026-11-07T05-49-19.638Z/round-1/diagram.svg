<svg xmlns="http://www.w3.org/2000/svg" width="810" height="462" viewBox="-50 -90 810 462"><rect x="-50" y="-90" width="810" height="462" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">Authenticated text statistics (AWS qualification) · r2</tspan></text><path d="M290,146 C380,146 380,186 470,186" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-28" width="210" height="44" fill="white"/><text x="380" y="-10" text-anchor="middle" font-size="12"><tspan x="380" dy="0">IAM-signed Invoke → co</tspan><tspan x="380" dy="18">unts returned</tspan></text><g><rect x="50" y="50" width="240" height="192" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Existing IAM caller</tspan><tspan x="66" dy="20">An existing same-account IAM pr</tspan><tspan x="66" dy="20">incipal outside the provisioning s</tspan><tspan x="66" dy="20">cope. It sends {text} by signed La</tspan><tspan x="66" dy="20">mbda Invoke. Its ARN is a Terraf</tspan><tspan x="66" dy="20">orm input and has not been verifi</tspan><tspan x="66" dy="20">ed.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="50" width="240" height="272" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="76" font-size="14"><tspan x="486" dy="0">Text statistics function</tspan><tspan x="486" dy="20">AWS Lambda</tspan><tspan x="486" dy="20">Takes {text} and returns the word</tspan><tspan x="486" dy="20"> count (words separated by white</tspan><tspan x="486" dy="20">space) and the Unicode code-poi</tspan><tspan x="486" dy="20">nt character count to the caller. It </tspan><tspan x="486" dy="20">owns its least-privilege execution</tspan><tspan x="486" dy="20"> role, a scoped CloudWatch log g</tspan><tspan x="486" dy="20">roup, a published version and a li</tspan><tspan x="486" dy="20">ve alias. It has no public URL.</tspan><tspan x="486" dy="20">ap-southeast-2 (candidate, not a</tspan><tspan x="486" dy="20">pproved)</tspan></text></g></g></svg>