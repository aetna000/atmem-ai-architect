<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="722" viewBox="-50 -90 1650 722"><rect x="-50" y="-90" width="1650" height="722" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#63758b"/></marker></defs><g font-family="sans-serif" fill="#1c3045"><text x="-20" y="-55" font-size="18"><tspan x="-20" dy="0">An authenticated AWS knowledge assistant… · r2</tspan></text><path d="M290,136 C380,136 380,316 470,316" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="-10" width="210" height="26" fill="white"/><text x="380" y="8" text-anchor="middle" font-size="12"><tspan x="380" dy="0">SigV4 question</tspan></text><path d="M290,406 C380,406 380,316 470,316" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="130" width="210" height="26" fill="white"/><text x="380" y="148" text-anchor="middle" font-size="12"><tspan x="380" dy="0">SigV4 question</tspan></text><path d="M710,316 C800,316 800,346 890,346" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="695" y="130" width="210" height="26" fill="white"/><text x="800" y="148" text-anchor="middle" font-size="12"><tspan x="800" dy="0">invoke with caller identity</tspan></text><path d="M1130,346 C1220,346 1220,176 1310,176" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="-28" width="210" height="44" fill="white"/><text x="1220" y="-10" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">read ACL-filtered eviden</tspan><tspan x="1220" dy="18">ce</tspan></text><path d="M1130,346 C1220,346 1220,456 1310,456" fill="none" stroke="#63758b" stroke-width="2" marker-end="url(#arrow)"/><rect x="1115" y="112" width="210" height="44" fill="white"/><text x="1220" y="130" text-anchor="middle" font-size="12"><tspan x="1220" dy="0">Converse with permitted </tspan><tspan x="1220" dy="18">evidence</tspan></text><g><rect x="50" y="50" width="240" height="172" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="76" font-size="14"><tspan x="66" dy="0">Alice (synthetic IAM caller)</tspan><tspan x="66" dy="20">An existing IAM test identity for s</tspan><tspan x="66" dy="20">ynthetic user Alice. It sits outside </tspan><tspan x="66" dy="20">the provisioning scope, has its o</tspan><tspan x="66" dy="20">wn document permissions, and is</tspan><tspan x="66" dy="20"> not modified by this design.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="50" y="330" width="240" height="152" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="66" y="356" font-size="14"><tspan x="66" dy="0">Bob (synthetic IAM caller)</tspan><tspan x="66" dy="20">An existing IAM test identity for s</tspan><tspan x="66" dy="20">ynthetic user Bob. His permission</tspan><tspan x="66" dy="20">s differ from Alice&apos;s, and this desi</tspan><tspan x="66" dy="20">gn does not modify the identity.</tspan><tspan x="66" dy="20">To be selected</tspan></text></g><g><rect x="470" y="190" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="486" y="216" font-size="14"><tspan x="486" dy="0">IAM-authenticated RAG API</tspan><tspan x="486" dy="20">Amazon API Gateway</tspan><tspan x="486" dy="20">A bounded HTTP API that uses I</tspan><tspan x="486" dy="20">AM authentication, with a separat</tspan><tspan x="486" dy="20">e scoped API role per caller and </tspan><tspan x="486" dy="20">authoritative subject and employ</tspan><tspan x="486" dy="20">ee-region inputs. Unknown identit</tspan><tspan x="486" dy="20">ies fail closed. Callers cannot inv</tspan><tspan x="486" dy="20">oke the Lambda directly.</tspan><tspan x="486" dy="20">ap-southeast-2 (candidate, not a</tspan><tspan x="486" dy="20">pproved)</tspan></text></g><g><rect x="890" y="190" width="240" height="312" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="906" y="216" font-size="14"><tspan x="906" dy="0">Bounded keyword RAG</tspan><tspan x="906" dy="20">AWS Lambda</tspan><tspan x="906" dy="20">Runs keyword retrieval (not vecto</tspan><tspan x="906" dy="20">r search) and filters results by AC</tspan><tspan x="906" dy="20">L and employee region before bu</tspan><tspan x="906" dy="20">ilding the prompt. It rechecks the </tspan><tspan x="906" dy="20">revision so revoked access is de</tspan><tspan x="906" dy="20">nied, and returns a cited answer t</tspan><tspan x="906" dy="20">hat contains only permitted titles, </tspan><tspan x="906" dy="20">snippets and citations. Owns its e</tspan><tspan x="906" dy="20">xecution role, logs, version and al</tspan><tspan x="906" dy="20">ias.</tspan><tspan x="906" dy="20">ap-southeast-2 (candidate, not a</tspan><tspan x="906" dy="20">pproved)</tspan></text></g><g><rect x="1310" y="50" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="76" font-size="14"><tspan x="1326" dy="0">Document and ACL catalog</tspan><tspan x="1326" dy="20">Amazon DynamoDB</tspan><tspan x="1326" dy="20">Holds up to 100 small synthetic U</tspan><tspan x="1326" dy="20">TF-8 documents with explicit AC</tspan><tspan x="1326" dy="20">Ls and authoritative employee-re</tspan><tspan x="1326" dy="20">gion mappings. An operator load</tspan><tspan x="1326" dy="20">s them through the generated co</tspan><tspan x="1326" dy="20">nditional management tool, and c</tspan><tspan x="1326" dy="20">allers cannot write to it.</tspan><tspan x="1326" dy="20">ap-southeast-2 (candidate, not a</tspan><tspan x="1326" dy="20">pproved)</tspan></text></g><g><rect x="1310" y="330" width="240" height="252" rx="10" fill="#edf4fb" stroke="#7290ad"/><text x="1326" y="356" font-size="14"><tspan x="1326" dy="0">Foundation model</tspan><tspan x="1326" dy="20">Amazon Bedrock</tspan><tspan x="1326" dy="20">A reviewed direct foundation mod</tspan><tspan x="1326" dy="20">el that is chosen through a Terraf</tspan><tspan x="1326" dy="20">orm model-ID input. Model acces</tspan><tspan x="1326" dy="20">s, Converse support, quotas and </tspan><tspan x="1326" dy="20">regional availability are unverified</tspan><tspan x="1326" dy="20">. It only receives evidence that ha</tspan><tspan x="1326" dy="20">s already been filtered.</tspan><tspan x="1326" dy="20">ap-southeast-2 (candidate, not a</tspan><tspan x="1326" dy="20">pproved)</tspan></text></g></g></svg>