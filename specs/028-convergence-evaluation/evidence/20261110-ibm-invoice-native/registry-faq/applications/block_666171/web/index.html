<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Help assistant</title><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<body><main><header><p class="eyebrow">Published help articles</p><h1>Help assistant</h1><p>Ask a question and explore the sources behind the answer.</p></header>
<form id="ask"><label for="question">Your question</label><textarea id="question" rows="4" maxlength="2000" placeholder="For example: How do I request a refund?" required></textarea><div class="actions"><button id="submit" type="submit" disabled>Ask</button><button id="clear" type="button" class="secondary">Clear</button></div></form>
<div class="activity-row"><span id="activity" hidden aria-hidden="true"><svg viewBox="-150 -135 300 260" width="40" height="36" xmlns="http://www.w3.org/2000/svg"><g fill="#F3A2B4"><path d="M7 -104 A41.2 41.2 0 0 1 78.8 -87.95 A40.71 40.71 0 0 1 124.2 -31.16 A38 38 0 0 1 116.93 36.3 A42.22 42.22 0 0 1 60.09 85.83 A29.75 29.75 0 0 1 7 84 Z"/><path d="M7 -104 A41.2 41.2 0 0 1 78.8 -87.95 A40.71 40.71 0 0 1 124.2 -31.16 A38 38 0 0 1 116.93 36.3 A42.22 42.22 0 0 1 60.09 85.83 A29.75 29.75 0 0 1 7 84 Z" transform="scale(-1 1)"/></g><g fill="#fff" stroke="#101314" stroke-width="11"><circle cx="-47" cy="26" r="35"/><circle cx="47" cy="26" r="35"/></g><g fill="#101314"><circle cx="-42" cy="21" r="10"/><circle cx="52" cy="21" r="10"/></g><path d="M-12 18 Q0 0 12 18" fill="none" stroke="#101314" stroke-width="11" stroke-linecap="round"/></svg></span><p id="status" role="status">Loading the assistant…</p></div>
<section aria-label="Answer"><p id="answer"></p><ul id="citations" aria-label="Sources"></ul></section></main></body></html>
