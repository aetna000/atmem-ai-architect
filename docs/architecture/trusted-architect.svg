<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1430" viewBox="0 0 1440 1430">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B3650"/></marker></defs>
<rect width="1440" height="1430" fill="#FAFBF9"/>
<style>text{font-family:Arial,sans-serif;fill:#172033}.title{font-size:35px;font-weight:700}.sub{font-size:18px;fill:#5F6A7C}.box-title{font-size:20px;font-weight:700}.body{font-size:16px;fill:#5F6A7C}.label{font-size:15px;fill:#8B3650;font-weight:700}</style>
<text x="720" y="61" text-anchor="middle" class="title">AtMem AI Architect: the trusted engineering workflow</text>
<text x="720" y="96" text-anchor="middle" class="sub">Target design • Client-specific solutions informed by proven practices • Independent checks before claims</text>
<rect x="470" y="140" width="500" height="93" rx="17" fill="#FCECF1" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="720.0" y="172" text-anchor="middle" class="box-title">1  Listen and understand</text>
<text x="720.0" y="199" text-anchor="middle" class="body">The client describes the goal in plain language.</text>
<text x="720.0" y="222" text-anchor="middle" class="body">Clarify scope, constraints and existing systems.</text>
<rect x="470" y="276" width="500" height="112" rx="17" fill="#FCECF1" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="720.0" y="308" text-anchor="middle" class="box-title">2  Plan the client’s actual system</text>
<text x="720.0" y="335" text-anchor="middle" class="body">Choose suitable patterns and explain the trade-offs.</text>
<text x="720.0" y="358" text-anchor="middle" class="body">Define resources, interfaces, identities and failure paths.</text>
<text x="720.0" y="381" text-anchor="middle" class="body">Keep decisions and assumptions traceable.</text>
<rect x="470" y="441" width="500" height="112" rx="17" fill="#FCECF1" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="720.0" y="473" text-anchor="middle" class="box-title">3  Build a tailored project</text>
<text x="720.0" y="500" text-anchor="middle" class="body">Generate infrastructure, application artifacts and wiring.</text>
<text x="720.0" y="523" text-anchor="middle" class="body">Pin dependencies and preserve existing deployments.</text>
<text x="720.0" y="546" text-anchor="middle" class="body">Produce concrete implementation and acceptance tasks.</text>
<rect x="470" y="617" width="500" height="132" rx="17" fill="#FCECF1" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="720.0" y="649" text-anchor="middle" class="box-title">4  Verify independently</text>
<text x="720.0" y="676" text-anchor="middle" class="body">Check provider schemas, lint and security policies.</text>
<text x="720.0" y="699" text-anchor="middle" class="body">Run positive, negative and integration tests.</text>
<text x="720.0" y="722" text-anchor="middle" class="body">Bind results to the exact generated artifact.</text>
<text x="720.0" y="745" text-anchor="middle" class="body">Keep unverified boundaries explicit.</text>
<rect x="470" y="828" width="500" height="114" rx="17" fill="#F3A2B4" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="720.0" y="860" text-anchor="middle" class="box-title">5  Deliver a coherent package</text>
<text x="720.0" y="887" text-anchor="middle" class="body">Terraform + application artifacts + precise Spec Kit</text>
<text x="720.0" y="910" text-anchor="middle" class="body">Tests, evidence, inputs and operating instructions</text>
<text x="720.0" y="933" text-anchor="middle" class="body">The client can understand and review the result.</text>
<rect x="470" y="1007" width="500" height="110" rx="17" fill="#FFFFFF" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="720.0" y="1039" text-anchor="middle" class="box-title">6  Review the real destination</text>
<text x="720.0" y="1066" text-anchor="middle" class="body">Review the account plan, costs and permissions.</text>
<text x="720.0" y="1089" text-anchor="middle" class="body">Stage, test and operate only after authorization.</text>
<text x="720.0" y="1112" text-anchor="middle" class="body">Include rollback, recovery and upgrade procedures.</text>
<polyline points="720,233 720,276" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="720,388 720,441" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="720,553 720,617" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="720,749 720,828" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="720,942 720,1007" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<text x="720" y="793" text-anchor="middle" class="label">Only claim what the current evidence establishes</text>
<rect x="42" y="140" width="363" height="115" rx="17" fill="#FFFFFF" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="223.5" y="172" text-anchor="middle" class="box-title">Constitution and expert skills</text>
<text x="223.5" y="199" text-anchor="middle" class="body">Listen • clarify • plan • build • verify</text>
<text x="223.5" y="222" text-anchor="middle" class="body">Architecture, cloud, security, DevOps,</text>
<text x="223.5" y="245" text-anchor="middle" class="body">FinOps and workload-specific guidance</text>
<polyline points="405,197 470,197" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="42" y="305" width="363" height="112" rx="17" fill="#FFFFFF" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="223.5" y="337" text-anchor="middle" class="box-title">Private project memory</text>
<text x="223.5" y="364" text-anchor="middle" class="body">AtMem retains the client’s requirements,</text>
<text x="223.5" y="387" text-anchor="middle" class="body">decisions, architecture and history.</text>
<text x="223.5" y="410" text-anchor="middle" class="body">Private data stays in its own scope.</text>
<polyline points="405,351 470,351" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1035" y="140" width="363" height="111" rx="17" fill="#FFFFFF" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="1216.5" y="172" text-anchor="middle" class="box-title">Reviewed public sources</text>
<text x="1216.5" y="199" text-anchor="middle" class="body">Maintained projects and primary docs</text>
<text x="1216.5" y="222" text-anchor="middle" class="body">Pinned revisions and provenance</text>
<text x="1216.5" y="245" text-anchor="middle" class="body">Public source text is untrusted evidence</text>
<rect x="1035" y="305" width="363" height="133" rx="17" fill="#FFFFFF" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="1216.5" y="337" text-anchor="middle" class="box-title">AtMem engineering knowledge</text>
<text x="1216.5" y="364" text-anchor="middle" class="body">Retrieve relevant, reviewed practices</text>
<text x="1216.5" y="387" text-anchor="middle" class="body">Applicability, versions and known limits</text>
<text x="1216.5" y="410" text-anchor="middle" class="body">Evidence: reviewed, locally tested,</text>
<text x="1216.5" y="433" text-anchor="middle" class="body">or independently deployment-verified</text>
<polyline points="1216,251 1216,305" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="1035,350 970,350" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>

<rect x="1035" y="617" width="363" height="132" rx="17" fill="#FFFFFF" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="1216.5" y="649" text-anchor="middle" class="box-title">Repair at the source</text>
<text x="1216.5" y="676" text-anchor="middle" class="body">Use precise findings to fix the generator</text>
<text x="1216.5" y="699" text-anchor="middle" class="body">or the required implementation.</text>
<text x="1216.5" y="722" text-anchor="middle" class="body">Regenerate and rerun affected tests.</text>
<text x="1216.5" y="745" text-anchor="middle" class="body">Keep scope and safeguards intact.</text>
<polyline points="970,687 1035,687" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1002" y="676" text-anchor="middle" class="label">Findings</text>
<polyline points="1216,617 1216,500 970,500" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1127" y="489" text-anchor="middle" class="label">Rebuild</text>
<rect x="42" y="617" width="363" height="132" rx="17" fill="#FFFFFF" stroke="#D6DDE5" stroke-width="1.5"/>
<text x="223.5" y="649" text-anchor="middle" class="box-title">Reviewed lessons</text>
<text x="223.5" y="676" text-anchor="middle" class="body">Store the cause, correction and evidence.</text>
<text x="223.5" y="699" text-anchor="middle" class="body">Record when the lesson applies.</text>
<text x="223.5" y="722" text-anchor="middle" class="body">Review before promoting it into shared</text>
<text x="223.5" y="745" text-anchor="middle" class="body">engineering knowledge.</text>
<polyline points="470,689 405,689" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="224,749 224,1183 1418,1183 1418,380 1398,380" fill="none" stroke="#8B3650" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="720" y="1216" text-anchor="middle" class="sub">Evidence feeds reviewed knowledge; it never turns one test into a universal guarantee.</text>
<rect x="42" y="1262" width="1356" height="112" rx="17" fill="#FFFFFF" stroke="#D6DDE5"/>
<text x="720" y="1297" text-anchor="middle" class="box-title">The client receives their own engineered solution, informed by proven systems.</text>
<text x="720" y="1328" text-anchor="middle" class="body">This is the target architecture. It does not mean every capability shown is implemented today.</text>
<text x="720" y="1353" text-anchor="middle" class="label">Motto: Listen. Understand. Architect. Build. Verify. Deliver with confidence.</text>
</svg>